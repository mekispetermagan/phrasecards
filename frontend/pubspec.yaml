name: phrasecards
description: "A personal Hungarian phrase-learning app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  characters: ^1.4.1
  collection: ^1.19.1
  flutter:
    sdk: flutter
  flutter_soloud: ^4.0.13
  http: ^1.6.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/
    - assets/audio/numbers/

flutter_launcher_icons:
  android: true
  image_path: "tool/launcher_icons/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "tool/launcher_icons/icon.png"
  adaptive_icon_foreground_inset: 20

  web:
    generate: true
    image_path: "tool/launcher_icons/icon.png"
    background_color: "#FFFFFF"
    theme_color: "#2196F3"
